name: Build Android APK

on:
  push:
    branches:
      - main # Hoặc nhánh bạn muốn trigger build
  pull_request:
    branches:
      - main

jobs:
  build_apk:
    runs-on: ubuntu-latest # Máy ảo chạy trên cloud với Ubuntu

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # Sử dụng Node.js phiên bản LTS tương ứng với project

    - name: Cache Node modules
      uses: actions/cache@v4
      with:
        path: '**/node_modules'
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Install Node dependencies
      run: npm ci # Sử dụng 'npm ci' để cài đặt chính xác từ package-lock.json

    - name: Build web assets
      run: npm run build

    - name: Sync Capacitor with Android
      run: npx cap sync android

    # --- Cấu hình môi trường Android Build ---
    # Android SDK và Java thường đã có sẵn trên runner của GitHub Actions
    # Tuy nhiên, bạn có thể cần tùy chỉnh theo yêu cầu cụ thể của project hoặc Capacitor.

    - name: Set up Android SDK
      uses: actions/setup-android@v3 # action này giúp cài đặt Android SDK
      # Bạn có thể cần cấu hình thêm version nếu cần:
      # with:
      #   sdk-platform: '34' # Ví dụ: Android 14 SDK Platform
      #   build-tools-version: '34.0.0' # Ví dụ: Build Tools 34.0.0

    # Có thể cần một bước để cấu hình thêm Java nếu mặc định không phù hợp
    # - name: Set up Java
    #   uses: actions/setup-java@v3
    #   with:
    #     distribution: 'temurin' # Hoặc 'zulu', 'adopt'
    #     java-version: '17' # Hoặc '11'

    - name: Generate TMDB API Key file (.env)
      run: |
        echo "VITE_TMDB_KEY=${{ secrets.VITE_TMDB_KEY }}" > .env
        echo "TMDB API Key được cấu hình từ GitHub Secrets."
      # Bạn cần thêm TMDB API Key của mình vào GitHub Secrets dưới tên VITE_TMDB_KEY

    - name: Build Android Release APK
      run: |
        cd android
        # Sẽ sử dụng Gradle Wrapper đã có trong project
        # Lệnh này sẽ build file .aab (App Bundle)
        ./gradlew bundleRelease
        # Nếu muốn build APK trực tiếp, dùng:
        # ./gradlew assembleRelease
      env:
        # Đảm bảo Capacitor có thể truy cập env var
        VITE_TMDB_KEY: ${{ secrets.VITE_TMDB_KEY }}

    - name: Upload APK/AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: chrtv-android-release
        path: android/app/build/outputs/bundle/release/app-release.aab # Hoặc đường dẫn tới file .apk