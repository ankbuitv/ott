name: Build Android APK (CHRTV)

on:
  workflow_dispatch:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      CMDLINE_TOOLS_VERSION: '11076708'
      # PHẢI khớp compileSdk/targetSdk trong android/variables.gradle (đang là 36)
      BUILD_TOOLS_VERSION: '36.0.0'
      PLATFORM_VERSION: 'android-36'
      # Keystore ký APK (CI tự tạo nếu chưa có secret) — không có chữ ký thì máy Android từ chối cài
      CHRTV_KEYSTORE_FILE: ${{ github.workspace }}/android/app/chrtv-release.jks
      CHRTV_KEYSTORE_PASSWORD: chrtv2026
      CHRTV_KEY_ALIAS: chrtv
      CHRTV_KEY_PASSWORD: chrtv2026

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # THIẾU BƯỚC NÀY LÀ HỎNG: trước đây chạy thẳng `npm run build` khi chưa cài
      # node_modules -> vite không tồn tại -> exit code 127.
      - name: Install dependencies
        run: npm ci

      - name: Create .env with TMDB key
        run: echo "VITE_TMDB_KEY=${{ secrets.VITE_TMDB_KEY }}" > .env

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor -> Android
        run: npx cap sync android

      # Capacitor 7 + AGP 8.13 biên dịch ở mức Java 21 -> JDK 17 sẽ fail
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSLf "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" -o tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null

      - name: Install Android platform & build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;${PLATFORM_VERSION}" \
            "build-tools;${BUILD_TOOLS_VERSION}"

      - name: Prepare signing keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$CHRTV_KEYSTORE_FILE"
            echo "Dùng keystore từ secret ANDROID_KEYSTORE_BASE64"
          else
            keytool -genkeypair -v \
              -keystore "$CHRTV_KEYSTORE_FILE" \
              -alias "$CHRTV_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$CHRTV_KEYSTORE_PASSWORD" -keypass "$CHRTV_KEY_PASSWORD" \
              -dname "CN=CHRTV PLAY, OU=ANKB CO., O=ANKB, L=Bien Hoa, S=Dong Nai, C=VN"
            echo "::warning::Chưa có secret ANDROID_KEYSTORE_BASE64 — CI tự tạo keystore tạm. Mỗi lần build là chữ ký khác nhau nên phải GỠ app cũ trước khi cài bản mới. Muốn cập nhật đè lên thì tạo secret này."
          fi

      - name: Build APK (release + debug)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew assembleDebug --no-daemon

      - name: Build App Bundle (AAB cho Google Play)
        continue-on-error: true
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/CHRTV-PLAY-1.0.0-beta-release.apk 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CHRTV-PLAY-1.0.0-beta-debug.apk 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/app-release.aab out/CHRTV-PLAY.aab 2>/dev/null || true
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrtv-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrtv-appbundle
          path: out/*.aab
          if-no-files-found: warn
          retention-days: 30
