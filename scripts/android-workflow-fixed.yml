name: Build Android APK (CHRTV)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GRADLE_USER_HOME: ~/.gradle
      ANDROID_HOME: ${{ github.workspace }}/.android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
      CMDLINE_TOOLS_VERSION: '11076708'
      BUILD_TOOLS_VERSION: '34.0.0'
      PLATFORM_VERSION: 'android-34'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Create .env with TMDB key
        run: |
          echo "VITE_TMDB_KEY=${{ secrets.VITE_TMDB_KEY }}" > .env

      - name: Install dependencies
        run: npm ci --progress=false

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor -> Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Tải cmdline-tools trực tiếp, không dùng actions/setup-android
      - name: Install Android SDK command-line tools
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          curl -sSLf "https://dl.google.com/android/repository/commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip" -o tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android platform & build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "platforms;${PLATFORM_VERSION}" \
            "build-tools;${BUILD_TOOLS_VERSION}" \
            "extras;google;usb_driver"

      - name: Install TV platform (hỗ trợ Android TV box — bỏ qua nếu package không tồn tại)
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "tv;${PLATFORM_VERSION}" || echo "tv;${PLATFORM_VERSION} không tồn tại trong SDK — bỏ qua (Leanback đã có qua gradle)"

      - name: Build Android APK/AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon

      - name: Sign release APK with debug keystore (cho bản cài tay)
        run: |
          cd android
          # Tạo keystore debug nếu chưa có rồi sign APK — đủ cho cài sideload/TV box.
          # Muốn bản chính thức (Play Store) thì tạo keystore riêng + để vào GitHub Secrets.
          ls app/build/outputs/apk/release/
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=CHRTV,O=CHRTV,C=VN" 2>/dev/null || true
            cp app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS_VERSION}/apksigner" sign \
              --ks debug.keystore --ks-pass pass:android --key-pass pass:android \
              --out app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release-unsigned.apk 2>&1 | tail -3
            echo "SIGNED OK"
          fi
          ls -la app/build/outputs/apk/release/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrtv-apk
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrtv-appbundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
