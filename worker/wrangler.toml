name = "chrtv-backend"
main = "worker.js"
compatibility_date = "2024-01-01"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "chrtv-db"
database_id = "chrtv-d1-database-id"

# Cloudflare KV Storage Binding cho EPG Cache
[[kv_namespaces]]
binding = "EPG_KV"
id = "chrtv-epg-kv-id"

# Cấu hình Assets Tĩnh cho Frontend Vite
[site]
bucket = "../dist"
