# Cấu hình chạy Worker CHRTV ở LOCAL (miniflare) kèm D1 giả lập.
#   npm run dev:api        -> Worker tại http://127.0.0.1:8787 (D1 local, tự tạo bảng)
#   VITE_DEV_API_TARGET=http://127.0.0.1:8787 npm run dev   -> web gọi Worker local
# database_id bên dưới chỉ là tên định danh cho D1 local, KHÔNG dùng để deploy.
name = "chrtv-backend-dev"
main = "worker/worker.js"
compatibility_date = "2024-01-01"

# ===== BIẾN CHỈ DÙNG LOCAL DEV (KHÔNG dùng để deploy) =====
# Production: set qua `wrangler secret put <NAME> <VALUE>` (xem SECURITY_FIX_RUNBOOK.md).
[vars]
JWT_SECRET = "dev-only-jwt-secret-local-1234567890"
STREAM_TOKEN_SECRET = "dev-only-stream-secret-local-1234567890"
ADMIN_MASTER_TOKEN = "dev-only-admin-master-token-local"
BREVO_SENDER_NAME = "NO REPLY - CHRTV PL▷Y"
BREVO_SENDER_EMAIL = "noreply@chrtv.app"
# Allowlist domain được nhúng làm player phim (frame-src của CSP) + điều kiện để
# /api/movie/sources trả nguồn. Production đặt bằng: wrangler secret put MOVIE_FRAME_SRC
# Ở local chỉ cần domain giả để test plumbing — không phải nguồn thật.
MOVIE_FRAME_SRC = "https://player.example-partner.test"
# ---- BẢO VỆ LUỒNG (chỉ local) ----
# proxy: luồng đi qua worker để thử mã hoá (production đang mặc định DIRECT)
STREAM_MODE = "proxy"
PROTECT = "on"
# "/lic" = relative -> player gọi cùng origin, vite proxy sang worker (xem vite.config.js)
LICENSE_BASE = "/lic"
# PHẢI GIỐNG HỆT secret của license worker khi chạy thật
LICENSE_SECRET = "dev-only-license-secret-local-1234567890"

[[d1_databases]]
binding = "DB"
database_name = "chrtv-db"
database_id = "local-dev-db"
